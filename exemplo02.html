<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <style>
        ul {
            padding: 0;
            margin: 0;
            list-style: none;

            > li {
                border: 1px solid darkgreen;
                background-color: green;
            }
        }

        .deconstructed-pancake {
            display: flex;
            flex-flow: row wrap;
            justify-content: center;
        }

        .deconstructed-pancake > * {
            flex: 1 0 120px;
            /*
            width: 120px;
            flex-grow: 1;
            flex-shrink: 0;
            */
        }
    </style>
    <title>Exemplo02</title>
</head>
<body>
    <main>
        <article>
            <ul class="deconstructed-pancake">
                <li>Lorem.</li>
                <li>Ratione?</li>
                <li>Esse?</li>
                <li>Ea?</li>
            </ul> 
        </article>
    </main>
</body>
</html>
